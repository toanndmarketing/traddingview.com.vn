events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ============================================
    # RATE LIMITING
    # ============================================
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:5m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=fastbull_api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=fastbull_ws_limit:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server_tokens off;
    client_max_body_size 100M;

    # ============================================
    # PROXY CACHE
    # ============================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=ghost_cache:100m max_size=1g inactive=60m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    map $http_cookie $skip_cache {
        default 0;
        ~*ghost-admin 1;
        ~*ghost-members 1;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $arg_pageSize $fastbull_page_size {
        default 50;
        ~^(10|20|30|50|100)$ $arg_pageSize;
    }

    # Cloudflare Real IP (Trust all for now, narrow down in production)
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    upstream ghost {
        server ghost:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ============================================
        # CACHE PURGE WEBHOOK ENDPOINT
        # ============================================
        location /api/purge-cache {
            client_max_body_size 0;
            proxy_pass http://cache-purge:9000/purge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Type application/json;
            proxy_http_version 1.1;
        }

        # FastBull: same-origin API proxy (avoid ISP/domain blocking on client side)
        location = /api/ext/fastbull/news {
            limit_req zone=fastbull_api_limit burst=20 nodelay;
            limit_conn conn_limit_per_ip 20;
            limit_except GET { deny all; }

            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_pass http://cache-purge:9000/news;

            add_header X-Ext-Proxy fastbull-news always;
            add_header X-Ext-Upstream-Status $upstream_status always;
            add_header X-Ext-Upstream-RT $upstream_response_time always;
        }

        location = /api/ext/fastbull/sentiment {
            limit_req zone=fastbull_api_limit burst=20 nodelay;
            limit_conn conn_limit_per_ip 20;
            limit_except GET { deny all; }

            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_pass http://cache-purge:9000/sentiment;

            add_header X-Ext-Proxy fastbull-sentiment always;
            add_header X-Ext-Upstream-Status $upstream_status always;
            add_header X-Ext-Upstream-RT $upstream_response_time always;
        }

        location = /ws/ext/fastbull/news {
            limit_req zone=fastbull_ws_limit burst=10 nodelay;
            limit_conn conn_limit_per_ip 10;
            limit_except GET { deny all; }

            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_set_header Host wsspush.fastbull.com;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_pass https://wsspush.fastbull.com/news?langId=10;

            add_header X-Ext-Proxy fastbull-ws always;
            add_header X-Ext-Upstream-Status $upstream_status always;
            add_header X-Ext-Upstream-RT $upstream_response_time always;
        }

        # ADMIN PANEL
        location /ghost {
            proxy_cache off;
            proxy_pass http://ghost;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # HTML PAGES + CACHE
        location / {
            proxy_cache ghost_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            
            proxy_pass http://ghost;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=600, s-maxage=600, stale-while-revalidate=60" always;
        }

        # STATIC FILES
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_cache ghost_cache;
            proxy_cache_valid 200 7d;
            proxy_pass http://ghost;
            proxy_set_header Host $host;
            expires 30d;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
