<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lịch Kinh Tế TradingView (Khớp Style Cũ)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
        }

        /* Giả lập phần canvas của Ghost theme */
        .gh-canvas {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .gh-article-title {
            font-size: 32px;
            font-weight: 700;
            color: #1e222d;
            margin-bottom: 8px;
        }

        .gh-article-excerpt {
            font-size: 16px;
            color: #4b5563;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <main class="gh-canvas">
        <h1 class="gh-article-title">Lịch Kinh Tế</h1>
        <p class="gh-article-excerpt">Theo dõi các sự kiện quan trọng và Chỉ số Kinh tế ảnh hưởng trên thị trường.</p>

        <!-- GIỮ NGUYÊN KHUNG STYLE CŨ CỦA BẠN (ĐÃ LOẠI BỎ OVERLAY CHE LOGO) -->
        <div class="main-tradingview" style="width: 100%; position: relative; top: -65px;">
            <div style="width: 100%; height: 100vh; min-height: 500px; max-height: 900px; margin-top: 80px; padding-left: 4px; padding-right: 8px; position: relative; overflow: hidden;">
                <!-- TradingView Widget BEGIN -->
                <div class="tradingview-widget-container" style="width: 100%; height: 100%;">
                    <div class="tradingview-widget-container__widget" style="width: 100%; height: 100%;"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
                    {
                        "width": "100%",
                        "height": "100%",
                        "colorTheme": "light",
                        "isTransparent": false,
                        "locale": "vi",
                        "importanceFilter": "-1,0,1"
                    }
                    </script>
                </div>
                <!-- TradingView Widget END -->
            </div>
        </div>
    </main>

</body>
</html>
